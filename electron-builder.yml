appId: com.mindfarm.desktop
productName: MindFarm
copyright: Copyright © 2026 MindFarm

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json

asar: true
afterSign: scripts/after-sign.cjs

mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch:
        - arm64
  extendInfo:
    NSHighResolutionCapable: true

fileAssociations:
  - ext: mind
    name: MindFarm 思维导图
    description: MindFarm 思维导图文档
    icon: build/document.icns
    role: Editor
    rank: Owner
    isPackage: false

dmg:
  title: ${productName} ${version}
  window:
    width: 540
    height: 380
  contents:
    - x: 140
      y: 200
      type: file
    - x: 400
      y: 200
      type: link
      path: /Applications
